params:
  learn:
    optim_stepsize: 3.0e-4
    schedule: fixed
    desired_kl: 0.016
    # init_noise_std: 1.0 ensures PPO gradients are mathematically stable (scale 1.0).
    # Physical scaling (e.g. 5cm exploration) is now handled in wrapper.py to prevent 
    # the 1/sigma^2 gradient explosion.
    init_noise_std: 1.0
    nsteps: 2048

    # PPO params
    cliprange: 0.2
    noptepochs: 5
    nminibatches: 4

    # Lowered to prevent entropy bonus from pushing large Cartesian deltas.
    ent_coef: 0.01
    gamma: 0.998
    lam: 0.95
    max_grad_norm: 1.0
    value_loss_coef: 1.0

  policy:
    pi_hid_sizes: [512, 256, 128]
    vf_hid_sizes: [512, 256, 128]
    activation: elu
