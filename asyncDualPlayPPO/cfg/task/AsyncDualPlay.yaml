name: AsyncDualPlay
physics_engine: physx
pipeline: gpu
sim_device: cuda:0
rl_device: cuda:0
graphics_device_id: 0

num_envs: 512
env_spacing: 1.5
episode_length: 3250
is_deterministic: False

# Args for the python config
alice_timesteps: 250
bob_timesteps: 600
max_goals_per_episode: 5

# Reward Configuration (ASP Paper Alignment)
# IMPORTANT: The ASP paper uses SPARSE REWARDS ONLY for unsupervised goal discovery.
# Dense rewards can "short-circuit" the adversarial curriculum.
# 
# use_dense_bob_rewards: Enable/disable dense distance-based rewards for Bob
# dense_reward_weight: Weight for dense rewards (0.0 = pure sparse, recommended)
#
# Recommendation: Keep use_dense_bob_rewards=false for pure ASP implementation.
# Only enable if Bob completely fails to learn after extended training.
# Enabled temporarily: Bob's sparse reward mean was ~0.001, too weak for RL signal.
# Disable once Bob's success rate recovers above ~25%.
use_dense_bob_rewards: true
dense_reward_weight: 0.1
