params:
  agent:
    batch_size: 256
    discount_factor: 0.95
    polyak: 0.005
    actor_learning_rate: 3.0e-4
    critic_learning_rate: 3.0e-4
    entropy_learning_rate: 3.0e-4
    learn_entropy: true
    initial_entropy_value: 0.2
    target_entropy: -4.0
    gradient_steps: 1
    random_timesteps: 500
    learning_starts: 1000
    grad_norm_clip: 1.0

  memory:
    memory_size: 200000

  policy:
    pi_hid_sizes: [512, 256, 128]
    qf_hid_sizes: [512, 256, 128]
    activation: relu
    lstm_hidden_size: 256
    lstm_num_layers: 1
    sequence_length: 8
    min_log_std: -20.0
    max_log_std: 2.0

  training:
    max_iterations: 1000
    pushes_per_iteration: 5
    max_pushes_per_episode: 5
    save_interval: 50
    warmup_pushes: 500
    log_interval: 1
