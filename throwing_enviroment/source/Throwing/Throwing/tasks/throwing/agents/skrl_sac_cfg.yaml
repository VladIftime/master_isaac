seed: 42

models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: True
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: -1.0
    network:
      - name: net
        input: STATES
        layers: [256, 256]
        activations: relu
    output: ACTIONS
  critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([STATES, ACTIONS])
        layers: [256, 256]
        activations: relu
    output: ONE
  critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([STATES, ACTIONS])
        layers: [256, 256]
        activations: relu
    output: ONE
  target_critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([STATES, ACTIONS])
        layers: [256, 256]
        activations: relu
    output: ONE
  target_critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([STATES, ACTIONS])
        layers: [256, 256]
        activations: relu
    output: ONE

memory:
  class: RandomMemory
  memory_size: 100000

agent:
  class: SAC
  batch_size: 256
  discount_factor: 0.99
  polyak: 0.005
  learning_rate: 3.0e-04
  random_timesteps: 100 #orig:1000
  learning_starts: 100 #orig:1000
  grad_norm_clip: 1.0
  learn_entropy: True
  initial_entropy_value: 1.0
  target_entropy: -2.0
  observation_preprocessor: null
  observation_preprocessor_kwargs: null
  experiment:
    directory: "throwing_primitive"
    experiment_name: ""
    write_interval: 100
    checkpoint_interval: 100 #orig:1000

trainer:
  class: SequentialTrainer
  timesteps: 35000
  environment_info: log
