# lula_right.yaml
api_version: 1.0

# 1. Kinematic Chain
cspace:
    - right_shoulder_pan_joint
    - right_shoulder_lift_joint
    - right_elbow_joint
    - right_wrist_1_joint
    - right_wrist_2_joint
    - right_wrist_3_joint

default_q: [0.75, 0.0, 0.0, 0.0, -0.0004, 0.0]

acceleration_limits: [10, 10, 10, 10, 10, 10]
jerk_limits: [10000, 10000, 10000, 10000, 10000, 10000]

# 2. Gripper Mimic Rules
cspace_to_urdf_rules:
    - {name: rgripper_finger_joint, rule: fixed, value: 0.0}
    - {name: rgripper_left_inner_knuckle_joint, rule: fixed, value: 0.0}
    - {name: rgripper_right_inner_knuckle_joint, rule: fixed, value: 0.0}
    - {name: rgripper_left_outer_finger_joint, rule: fixed, value: 0.0}
    - {name: rgripper_right_outer_finger_joint, rule: fixed, value: 0.0}
    - {name: rgripper_left_inner_finger_joint, rule: fixed, value: 0.0}
    - {name: rgripper_right_inner_finger_joint, rule: fixed, value: 0.0}

