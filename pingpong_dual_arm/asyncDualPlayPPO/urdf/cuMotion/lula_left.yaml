# lula_left.yaml
api_version: 1.0

# 1. Kinematic Chain
cspace:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint

default_q: [1.57, -1.57, 1.57, -1.57, -1.57, 0.0]

acceleration_limits: [10, 10, 10, 10, 10, 10]
jerk_limits: [10000, 10000, 10000, 10000, 10000, 10000]

# 2. Gripper Mimic Rules
cspace_to_urdf_rules:
    - {name: finger_joint, rule: fixed, value: 0.0}
    - {name: left_inner_finger_joint, rule: fixed, value: 0.0}
    - {name: right_inner_finger_joint, rule: fixed, value: 0.0}

# 3. Collision Spheres
collision_spheres:
  - body_base_link:
    - "center": [0, 0, 0]
      "radius": 0.1
  - body_shoulder_link:
    - "center": [0, 0, 0]
      "radius": 0.1
  - body_upper_arm_link:
    - "center": [0, 0, 0.2]
      "radius": 0.1
  - body_forearm_link:
    - "center": [0, 0, 0.2]
      "radius": 0.1
  - body_wrist_1_link:
    - "center": [0, 0, 0]
      "radius": 0.08
  - body_wrist_2_link:
    - "center": [0, 0, 0]
      "radius": 0.08
  - body_wrist_3_link:
    - "center": [0, 0, 0]
      "radius": 0.08